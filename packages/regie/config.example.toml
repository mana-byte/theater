# Régie configuration — every standalone [regie] setting and its default.
#
#   mkdir -p "$THEATER_HOME/regie"
#   cp packages/regie/config.example.toml "$THEATER_HOME/regie/config.toml"
#
# Theater never reads or rewrites this file. It belongs to the independently
# installed `regie` command, which reads only the [regie] table below.

[regie]

# Defaults to "ansi-dark", which follows your terminal's own colours.
# theme = "catppuccin-mocha"

# State-follow refresh interval in seconds; the diagnostic bus long-polls (no interval).
tree_interval = 1.0
bus_batch = 50

# Tree and layout presentation.
cwd_segments = 2
participant_detail = "cwd"
sidebar_width = 52
bus_visible = false
# The usage footer starts hidden; `$` or the palette toggles it for the session.
usage_visible = false
startup_reveal = true

# The ambience: an animation in the empty space under the agent tree. Pick one:
#   "footer"    a quiet line on the band's bottom row that breathes now and then (default)
#   "leaves"    a sparse drift of falling leaves
#   "fire"      a small campfire that kindles, burns and smokes
#   "aquarium"  fish swimming by, rising bubbles and swaying seaweed
#   "stars"     a twinkling sky, the odd shooting star, a passing ship, and rarely
#               the star whale, who eats every star before it swims away
#   "none"      nothing at all
# or the name of your own plugin in $THEATER_HOME/regie/plugins/<name>/ (see README.md).
tree_ambience = "footer"
# When it plays: "away" while you work in a staged terminal or trajectory, or "tree"
# while the tree itself has focus. Once you leave it, it rests ten seconds before replaying.
tree_ambience_when = "away"
cost_window = "day"

# Leave dashboard_sentences absent to use the built-in rotating content.
# dashboard_sentences = ["One focused sentence.", "Another focused sentence."]
dashboard_sentence_hold_seconds = 10.0
dashboard_sentence_char_interval = 0.1
dashboard_tip_hold_seconds = 6.0
dashboard_tip_char_interval = 0.04

# Maximum records shown by the local trajectory presentation page.
trajectory_page_size = 30
