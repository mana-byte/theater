[project]
name = "regie"
version = "1.0.0rc10"
authors = [{ name = "Manaiki Laut", email = "manaikilaut@gmail.com" }]
description = "Independent Theater frontend and tmux terminal provider"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "theater==1.0.0rc10",
    "textual>=0.40.0",
]

[project.scripts]
regie = "regie.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/regie"]

[tool.hatch.build.targets.sdist]
include = ["README.md", "src/regie/**"]

[tool.uv.sources]
theater = { workspace = true }
