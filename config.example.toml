# Theater configuration — every setting, with its default.
#
#   cp config.example.toml ~/.theater/config.toml
#
# This file is an example. Theater does not read it from the repository: the
# real one lives at $THEATER_HOME/config.toml, and `theater config path` prints
# where that is on your machine.
#
# Every key below is set to the value Theater uses when it is absent, so this
# file is a complete, working config that changes nothing. Edit what you want
# to differ and delete the rest.
#
# Writing a key down does have one effect: `theater config` will report it as
# coming from your file rather than from the code, and if a future version
# changes a default, your copy keeps the old value. Delete a key to track the
# code's default instead.
#
# Read once, at daemon start. `theater restart` applies an edit.
# Machine-scoped: there is no project-local config, because there is one daemon
# per machine holding one registry.
# An unknown key is a hard error naming the file, the key and the closest legal
# spelling. A typo that is silently ignored is the defect this file exists to
# avoid.
#
# Full reference: README.md (Configuration), docs/harness-plugins.md.


[theater]

# Harness used when `theater spawn` is given no harness name, and sorted first
# in the régie's ctrl+p palette. Must name a harness the registry actually
# holds — shipped or local, and not disabled below — checked at daemon start.
#
# Left commented because its default is "no favourite", and TOML has no way to
# write that: the key is either absent or set to a name.
# favourite = "vibe"


[regie]

# Textual theme for the régie TUI. One of:
#   ansi-dark ansi-light atom-one-dark atom-one-light catppuccin-frappe
#   catppuccin-latte catppuccin-macchiato catppuccin-mocha dracula flexoki
#   gruvbox monokai nord rose-pine rose-pine-dawn rose-pine-moon
#   solarized-dark solarized-light textual-dark textual-light tokyo-night
# Unset means Textual's own default, which is why this one is left commented:
# there is no theme name that means "whatever Textual picks". A name Textual
# does not know is reported in the régie's status line, not crashed on — a bad
# theme is cosmetic.
# theme = "nord"

# How often the participant tree is rebuilt, in seconds.
tree_interval = 1.0

# How often the bus pane polls for new events, in seconds.
bus_interval = 0.4

# How many bus events to pull per poll.
bus_batch = 50

# How many trailing directory segments of a participant's cwd the tree keeps;
# the rest is elided with …/. Applied after ~ abbreviation, so ~ is a preserved
# prefix rather than a counted segment: ~/a/b/c with the default of 2 becomes
# ~/…/b/c. A leaf with no directory at all is a different feature, so the
# minimum is 1.
cwd_segments = 2

# Column width of the sidebar. Read once, used twice: the sidebar's Textual
# style and the tmux resize when an agent is staged — the two must agree or
# Textual and tmux tear at the boundary. Below 40, depth-3 rails plus a
# two-segment path no longer fit, so the feature the width exists for is
# already broken. No ceiling: tmux refuses anything the window cannot honour.
sidebar_width = 52

# Whether the régie opens with the bus panel showing. Off by default: the tree
# is what the régie is for, and the event log is a debugging surface most
# sessions never need. ctrl+p offers "Show bus panel" when you do. While it is
# hidden the bus is not polled, so showing it resumes from the last event drawn
# rather than skipping whatever arrived meanwhile.
bus_visible = false


[rails]

# Maximum depth of a spawn tree; roots are depth 0. With the default, a root
# may spawn a child, which may spawn a grandchild, which may not spawn.
depth_cap = 3

# How many participants one tree may hold before further spawns are refused.
# The two together are what stops a runaway agent filling the machine with
# panes, so raise them deliberately.
budget = 20


[observer]

# All values are seconds. The floor for any of them is 0.01 — below that the
# daemon spends more time waking up than working, so a typo'd 0.0001 is
# rejected rather than left to spin a core.

# How often to check a known transcript for new bytes. This is what the régie
# renders, and a second of lag on "what is it doing right now" is visible.
poll_interval = 0.25

# How often to look for a transcript that has not appeared yet. Slower because
# it is a directory scan rather than a stat.
search_interval = 2.0

# How long a transcript may be quiet before the observer re-locates it. Vibe
# opens a new session directory on some turns; without this the observer stays
# locked onto a file that will never grow again.
relocate_timeout = 5.0

# How long a transcript may be quiet before the screen is checked for a bare
# prompt — which is how AWAITING_INPUT is detected. Long enough that a slow
# tool call does not trigger it, short enough that a human watching notices.
awaiting_input_timeout = 1.5

# How often to read the screen of a harness that has no transcript at all — a
# plugin whose adapter sets `has_transcript = False`. Much faster than the
# timeout above, because for those harnesses the screen is not a hint about a
# stuck agent — it is the only evidence a turn ended, and a caller is blocked
# on it. A turn is called finished only when two consecutive polls agree, so
# this is also half the detection latency.
screen_interval = 1.0

# How long a transcript may be quiet, over a screen that looks idle, before any
# job still running against that participant is finished anyway. A backstop for
# a turn boundary the parser never saw — an aborted turn, a badly timed
# rotation — which would otherwise leave the agent that sent the prompt waiting
# on a promise nothing can resolve.
#
# Much longer than awaiting_input_timeout, because the two answer different
# questions. That one paints a status a human can correct at a glance; this one
# resolves a promise another agent is blocked on, and firing it early hands out
# a half-written answer. The rescued reply is the last thing the agent said, and
# carries error_code = "turn_end_unseen" so a caller can tell salvage from a
# reply the harness declared finished.
rescue_timeout = 60.0

# How often the observer reconciles its watch tasks against the registry.
sync_interval = 1.0


[retention]

# The database grows without bound unless old rows are swept. The daemon runs
# a garbage-collection loop on the interval below; it is on by default, because
# the whole point is that the database is bounded without the user having to
# configure anything. Set `enabled = false` to disable it entirely.
#
# Measured on a real machine over 4.26 days: the `bus` table was 94.2% of the
# file (30.20 MB, 7.1 MB/day). Jobs were 3.4%, participants 0.16%, touch 0.06%.

# Whether the GC loop runs at all. Off only for debugging; the database grows
# without it.
enabled = true

# Seconds between sweeps.
interval = 3600.0

# Rows per DELETE statement. The Store is synchronous on the daemon's event
# loop, so a single large blocking DELETE freezes every agent's status polling
# and every await. Measured: 32,217 rows in 96 ms.
batch = 5000

# Bus events older than this many days are deleted. The régie's bus feed is
# forward-only (cursor-based), and nothing anywhere reads a week-old bus event.
# `send.refused` events are exempt — they are the only record of a refused
# send — and capped by `refused_cap` instead.
bus_days = 7

# Finished jobs older than this many days are deleted, along with their `touch`
# rows. Two months: recall over a job older than that is nearly worthless,
# because the code has moved, branches are merged or deleted, and the harness
# transcript is usually gone from disk already.
#
# Jobs are filtered on `finished_at`, never `created_at`: a running job has
# finished_at = NULL, and NULL < x is never true in SQL, so a sweep can never
# delete a job whose caller is still waiting on it.
jobs_days = 15

# Maximum number of `send.refused` bus rows to keep. These are exempt from the
# age TTL because they are the only record of a refused send. Observed rate is
# ~3/day, so this cap is roughly a century of headroom; it exists to make the
# growth bounded rather than because it is expected to bind.
refused_cap = 10000

# A running job whose daemon was killed mid-turn has finished_at = NULL forever.
# After this many days, such a job is marked crashed/abandoned so it does not
# accumulate and pin its participant against deletion. 7 days is orders of
# magnitude longer than the observer's 60 s rescue timeout, so it can only
# ever catch jobs from a previous daemon lifetime.
stale_running_days = 7


[harness]

# Harness plugins to leave out of the registry, by name. Everything Theater can
# drive is a plugin: the adapters it ships live beside the ones you write, and
# this is the only key that decides which of them load.
#
# A denylist rather than an allowlist, so a harness added in a later release
# shows up without anyone editing this file. The opposite choice would make
# every new adapter invisible on every existing install, which is a bug report
# rather than a setting.
#
# Disabling is absence, not refusal. A disabled harness cannot be spawned, is
# not offered in the palette, and is not looked for when adopting an unmanaged
# pane. An agent that registers under the name anyway still appears in the
# tree, drawn with the unknown icon — hiding a session that exists would be
# worse than admitting Theater cannot read it.
#
# The name is matched against the plugin's filename before the file is
# imported, and against the harness name afterwards. Matching the filename
# first is what lets you switch off a plugin that fails on import — the case
# where you need this most, and the one an allowlist of names could not reach.
#
# `theater harnesses` lists what loaded, where each one came from, and why any
# were rejected. Writing your own: docs/harness-plugins.md.
disabled = []


[models]

# What `theater spawn --model` may name, per harness. One key per harness, each
# a list of model names; a harness with no key here, or an empty list, refuses
# every `--model` and its children run on whatever their own CLI config chose.
#
# So the whole section is commented out, and unlike every other setting in this
# file there is no default to write down. Absent is not a value Theater picked
# on your behalf — it is the behaviour every spawn had before this option
# existed, which is the right thing to keep doing until someone says otherwise.
# Naming a model here is a deliberate grant: an agent that can spawn can now
# spend it, at its price, without asking a human first.
#
# An allowlist rather than a denylist, the opposite of `[harness] disabled`
# above, because the two lists fail in opposite directions. A harness that
# appears in a later release should work without editing this file; a model
# that appears in a later release should not become spendable without editing
# it. Absence is the safe answer here and the unhelpful one there.
#
# Names are passed to the CLI untouched — Theater checks membership and nothing
# else. Model namespaces change faster than this project releases, so a listed
# name the CLI does not recognise still fails, in the child's pane, where the
# vendor that owns the namespace can explain it properly. That also means the
# spelling has to be the CLI's own, not a friendly alias.
#
# `theater models` shows what is allowed now. `theater models --discover
# <harness>` asks a CLI what it can run and prints a block to paste here, which
# you then cut down; not every CLI can be asked, and none of it is consulted at
# spawn time.
# claude   = ["opus-4.1", "sonnet-4"]
# opencode = ["anthropic/claude-sonnet-4"]


[reasoning]

# What `theater spawn --reasoning-effort` may name, per harness. One key per
# harness, each a list of effort strings; a harness with no key here, or an
# empty list, refuses every `--reasoning-effort` and its children run on
# whatever their own CLI config chose.
#
# Absent is not a value Theater picked on your behalf — it is the behaviour
# every spawn had before this option existed, which is the right thing to keep
# doing until someone says otherwise. Naming an effort here is a deliberate
# grant: an agent that can spawn can now spend it, at its price, without asking
# a human first.
#
# Same shape and the same failure direction as `[models]` above: an allowlist,
# not a denylist, so a model that appears in a later release does not become
# spendable without editing this file.
#
# Names are passed to the CLI untouched — Theater checks membership and nothing
# else. Spelling has to be the CLI's own, not a friendly alias, and matching is
# exact: "HIGH" != "high". The lists below are the efforts each built-in CLI
# advertises today, kept commented out so absence remains the default.
#
# How each harness receives the value:
#   codex  -> `-c model_reasoning_effort=<value>`
#   claude -> `--effort=<value>`
#   opencode and vibe do not support reasoning effort — their adapters omit the
#   parameter, and naming one for them is refused before it reaches the adapter.
#
# `theater models` shows the allowed efforts alongside the allowed models.
#
# codex   = ["none", "minimal", "low", "medium", "high", "xhigh", "max", "ultra"]
# claude  = ["low", "medium", "high"]
