[project]
name = "theater"
version = "1.0.0rc7"
authors = [{ name = "Manaiki Laut", email = "manaikilaut@gmail.com" }]
description = "Cross-harness orchestration layer for coding agents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.0.0",
    "textual>=0.40.0",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "opentelemetry-api>=1.44,<2",
    "pyyaml>=6.0",
]

[project.scripts]
theater = "theater.cli:main"

[project.optional-dependencies]
observability = [
    "opentelemetry-sdk>=1.44,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.44,<2",
    "opentelemetry-exporter-otlp-proto-grpc>=1.44,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["theater"]

[tool.hatch.build.targets.wheel.force-include]
"theater/harness/builtin/plugins/pi/theater_mcp_bridge.ts" = "theater/harness/builtin/plugins/pi/theater_mcp_bridge.ts"
"theater/harness/builtin/plugins/pi/pi_startup_filter.cjs" = "theater/harness/builtin/plugins/pi/pi_startup_filter.cjs"

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.44,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.44,<2",
    "opentelemetry-sdk>=1.44,<2",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.2",
]

[tool.uv]
exclude-newer = "2 days"

[tool.ruff]
line-length = 100

extend-exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "F", "E9",      # the gate that already existed
    "E", "W",       # pycodestyle
    "I",            # import order
    "N",            # naming
    "UP",           # syntax that 3.12 made obsolete
    "B",            # bugbear
    "SIM", "C4", "RET",
    "ASYNC",        # blocking calls inside async functions
    "PTH",          # os.path -> pathlib
    "RUF",
    "PL",           # pylint subset
    "TRY",
]
ignore = [
    "RUF001", "RUF002", "RUF003",
    "N818",
    "TRY003",
    "PLC0415",
    "PLR2004",
    "PLR0911", "PLR0913", "PLR0917",
    "ASYNC109",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ASYNC110", "ASYNC240"]

[tool.mypy]
python_version = "3.12"
files = ["theater"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "tmux: drives a real tmux server; skipped when tmux is not installed",
    "unpatched_tmux_client: exercises theater.tmux.client itself, so the autouse `fake_tmux` must stand aside",
]

[tool.coverage.run]
source = ["theater"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
