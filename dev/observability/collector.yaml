receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
  prometheus/collector:
    config:
      scrape_configs:
        - job_name: opentelemetry-collector
          scrape_interval: 10s
          static_configs:
            - targets: [127.0.0.1:8888]

extensions:
  health_check:
    endpoint: 127.0.0.1:13133
    path: /ready

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
    spike_limit_mib: 64
  batch:
    timeout: 1s
    send_batch_size: 512
    send_batch_max_size: 1024

exporters:
  otlp_http/metrics:
    endpoint: http://127.0.0.1:9090/api/v1/otlp
    sending_queue:
      queue_size: 512
    retry_on_failure:
      max_elapsed_time: 30s
  otlp_http/traces:
    endpoint: http://127.0.0.1:4418
    sending_queue:
      queue_size: 512
    retry_on_failure:
      max_elapsed_time: 30s
  otlp_http/logs:
    endpoint: http://127.0.0.1:3100/otlp
    sending_queue:
      queue_size: 512
    retry_on_failure:
      max_elapsed_time: 30s

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp_http/traces]
    metrics:
      receivers: [otlp, prometheus/collector]
      processors: [memory_limiter, batch]
      exporters: [otlp_http/metrics]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp_http/logs]
