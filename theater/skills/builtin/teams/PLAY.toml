description = "Run a team of agents under one master-lead, who directs team-leads, who direct team-members; worker, reviewer and debater are task roles for leads and members."
master = "master-lead"

[positions]
master-lead = ["team-lead"]
team-lead = ["team-member"]
team-member = []

[roles]
worker = ["team-lead", "team-member"]
reviewer = ["team-lead", "team-member"]
debater = ["team-lead", "team-member"]
