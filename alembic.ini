# Alembic, for developer use from the repo root:
#
#   uv run alembic revision --autogenerate -m "add a column"
#   uv run alembic upgrade head
#
# The daemon does not read this file. It builds an in-memory Config in
# `Store._config` and points it at the same script_location, so the two can
# never disagree about which revisions exist.
#
# `sqlalchemy.url` is deliberately absent: env.py resolves the database from
# $THEATER_HOME, which is the only source of truth for where state lives.
[alembic]
script_location = theater/daemon/migrations
prepend_sys_path = .
