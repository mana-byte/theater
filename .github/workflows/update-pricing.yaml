name: update pricing

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-pricing
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch latest litellm pricing
        run: |
          curl -sL https://raw.githubusercontent.com/BerriAI/litellm/main/model_prices_and_context_window.json \
            -o theater/pricing/model_prices.json
      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet theater/pricing/model_prices.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi
      - name: Create PR
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BRANCH="chore/update-pricing-$(date -u +%Y%m%d)"
          git checkout -b "$BRANCH"
          git add theater/pricing/model_prices.json
          git commit -m "chore(pricing): update litellm pricing snapshot"
          git push origin "$BRANCH"
          gh pr create \
            --title "chore(pricing): update litellm pricing snapshot" \
            --body "Automated pricing update from [BerriAI/litellm](https://github.com/BerriAI/litellm)." \
            --base main --head "$BRANCH"
