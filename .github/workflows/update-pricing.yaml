name: update pricing

on:
  workflow_dispatch:
  schedule:
    - cron: "17 7 * * 1"

permissions:
  contents: read

concurrency:
  group: update-pricing
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - run: uv sync --frozen --group dev
      - name: Fetch and validate pricing
        run: |
          set -euo pipefail
          tmp="$(mktemp theater/pricing/.model_prices.json.XXXXXX)"
          curl -fsSL --retry 3 --retry-delay 5 \
            https://raw.githubusercontent.com/BerriAI/litellm/main/model_prices_and_context_window.json \
            -o "$tmp"
          uv run python -c "import json,sys; d=json.load(open(sys.argv[1])); assert isinstance(d,dict) and len(d)>0" "$tmp"
          mv "$tmp" theater/pricing/model_prices.json
      - run: uv run pytest tests/pricing/test_catalog.py -q
      - name: Detect changes
        id: diff
        run: |
          if git diff --quiet theater/pricing/model_prices.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        if: steps.diff.outputs.changed == 'true'
        with:
          token: ${{ secrets.PR_AUTOMATION_TOKEN }}
          base: main
          branch: chore/update-pricing
          commit-message: "chore(pricing): update litellm pricing snapshot"
          title: "chore(pricing): update litellm pricing snapshot"
          body: "Automated pricing update from [BerriAI/litellm](https://github.com/BerriAI/litellm)."
          delete-branch: true
