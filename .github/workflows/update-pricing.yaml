name: update pricing

on:
  workflow_dispatch:
  schedule:
    - cron: "17 7 * * 1"

permissions:
  contents: read

concurrency:
  group: update-pricing
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
      - run: uv sync --frozen --group dev
      - name: Fetch and validate pricing
        run: |
          set -euo pipefail
          tmp="$(mktemp theater/pricing/.model_prices.json.XXXXXX)"
          curl -fsSL --retry 3 --retry-delay 5 \
            https://raw.githubusercontent.com/BerriAI/litellm/main/model_prices_and_context_window.json \
            -o "$tmp"
          uv run python -c "import json,sys; d=json.load(open(sys.argv[1])); assert isinstance(d,dict) and len(d)>0" "$tmp"
          mv "$tmp" theater/pricing/model_prices.json
      - run: uv run pytest tests/test_pricing.py -q
      - name: Detect changes
        id: diff
        run: |
          if git diff --quiet theater/pricing/model_prices.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        if: steps.diff.outputs.changed == 'true'
        with:
          token: ${{ secrets.PR_AUTOMATION_TOKEN }}
          base: main
          branch: chore/update-pricing
          commit-message: "chore(pricing): update litellm pricing snapshot"
          title: "chore(pricing): update litellm pricing snapshot"
          body: "Automated pricing update from [BerriAI/litellm](https://github.com/BerriAI/litellm)."
          delete-branch: true
