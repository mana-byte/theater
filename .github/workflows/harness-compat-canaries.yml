name: Harness compatibility canaries
run-name: Harness compatibility canaries (${{ github.event_name }})

# The live conformance suite is only trusted while it notices deliberately broken plugins. These
# canaries run when the suite changes and weekly, never per release (see docs/harness-compat.md).
on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/harness-compat-canaries.yml"
      - "scripts/harness_compat/canaries.py"
      - "scripts/harness_compat/codecopy.py"
      - "scripts/harness_compat/cleanup.py"
      - "scripts/harness_compat/contract.py"
      - "scripts/harness_compat/framework.py"
      - "scripts/harness_compat/git.py"
      - "scripts/harness_compat/policy.py"
      - "scripts/harness_compat/qualify.py"
      - "scripts/harness_compat/process.py"
      - "scripts/harness_compat/sandbox.py"
      - "scripts/harness_compat/suite_runner.py"
      - "scripts/harness_compat/mock.py"
      - "tests/conformance/**"
      - "tests/support/live_rig.py"
      - "tests/support/live_stack.py"
      - "tests/support/obligations.py"
      - "tests/support/coverage.py"
      - "tests/support/declarations.py"
      - "tests/support/mutations.py"
      - "tests/support/tool_effects.py"
      - "tests/support/compat_probe/**"
      - "theater/harness/contracts/compat.py"
      - "theater/harness/builtin/plugins/**/compat.py"
      - "theater/harness/contracts/version_policy.py"
      - "theater/harness/manifests/validation.py"
      - "pyproject.toml"
      - "uv.lock"

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"

concurrency:
  group: harness-compat-canaries-${{ github.ref }}
  cancel-in-progress: true

jobs:
  canaries:
    name: Canaries ${{ matrix.harness }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        harness: [claude, codex, opencode, pi, vibe]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux
      - run: uv sync --locked --all-packages --group dev
      - name: Break each plugin on purpose and require the suite to notice
        env:
          HARNESS: ${{ matrix.harness }}
        run: uv run --no-sync --no-cache python -m scripts.harness_compat canaries "$HARNESS"
