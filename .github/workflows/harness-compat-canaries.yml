name: Harness compatibility canaries
run-name: Harness compatibility canaries (${{ github.event_name }})

# The live conformance suite is only trusted while it notices deliberately broken plugins. These
# canaries run when the suite changes and weekly, never per release (see docs/harness-compat.md).
on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/harness-compat-canaries.yml"
      - "scripts/harness_compat/canaries.py"
      - "scripts/harness_compat/suite_runner.py"
      - "scripts/harness_compat/mock.py"
      - "tests/conformance/**"
      - "tests/support/live_rig.py"
      - "tests/support/obligations.py"
      - "tests/support/mutations.py"
      - "tests/support/tool_effects.py"
      - "tests/support/compat_probe/**"
      - "theater/harness/contracts/compat.py"
      - "theater/harness/builtin/plugins/**/compat.py"

permissions:
  contents: read

concurrency:
  group: harness-compat-canaries-${{ github.ref }}
  cancel-in-progress: true

jobs:
  canaries:
    name: Canaries ${{ matrix.harness }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        harness: [claude, codex, opencode, opencode2, pi, vibe]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux
      - run: uv sync --locked --all-packages --group dev
      - name: Break each plugin on purpose and require the suite to notice
        env:
          HARNESS: ${{ matrix.harness }}
          THEATER_COMPAT_DIAGNOSTICS: ${{ runner.temp }}/compat-diagnostics
        run: uv run python -m scripts.harness_compat canaries "$HARNESS"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: compat-canaries-${{ matrix.harness }}
          path: ${{ runner.temp }}/compat-diagnostics
          if-no-files-found: ignore
          retention-days: 14
