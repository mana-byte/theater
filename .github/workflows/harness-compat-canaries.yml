name: Harness compatibility canaries
run-name: Harness compatibility canaries (${{ github.event_name }})

# The live conformance suite is only trusted while it notices deliberately broken plugins. These
# canaries run when the suite changes and weekly, never per release (see docs/harness-compat.md).
on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/harness-compat*.yml"
      - "scripts/harness_compat/**"
      - "tests/conformance/**"
      - "tests/support/**"
      - "tests/conftest.py"
      - "theater/**"
      - "packages/regie/src/**"
      - "Makefile"
      - "pyproject.toml"
      - "uv.lock"

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"

concurrency:
  group: harness-compat-canaries-${{ github.ref }}
  cancel-in-progress: true

jobs:
  canaries:
    name: Canaries ${{ matrix.harness }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        harness: [claude, codex, opencode, pi, vibe]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      # Codex's Linux sandbox needs bubblewrap, and Ubuntu 24.04 denies it the user namespace it
      # needs: without both a workspace patch asks for an approval.
      - name: Install tmux and let bubblewrap sandbox
        run: |
          sudo apt-get update && sudo apt-get install -y tmux bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: uv sync --locked --all-packages --group dev
      - name: Break each plugin on purpose and require the suite to notice
        env:
          HARNESS: ${{ matrix.harness }}
        run: timeout --signal=INT --kill-after=5m 50m .venv/bin/python -m scripts.harness_compat canaries "$HARNESS"
