name: Harness compatibility
run-name: Harness compatibility (${{ github.event_name }})
on:
  schedule:
    - cron: "43 5 * * *"
  workflow_dispatch:
    inputs:
      harness:
        description: Harness whose newer releases should be tested
        required: true
        default: all
        type: choice
        options: [all, claude, codex, opencode, pi, vibe]
  pull_request:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('harness-compat-pr-{0}', github.ref) || format('harness-compat-run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  static-checks:
    name: Static checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
      - run: uv sync --locked --all-packages --group dev
      - run: uv run ruff check --no-cache scripts/harness_compat
      - run: uv run ruff format --check --no-cache scripts/harness_compat
      - run: uv run mypy
      - run: uv run --no-sync --no-cache pytest -p no:cacheprovider tests/compat tests/conformance -q

  plan:
    name: Select harnesses
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      harnesses: ${{ steps.plan.outputs.harnesses }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          REQUESTED_HARNESS: ${{ inputs.harness || 'all' }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          args=(plan "$REQUESTED_HARNESS")
          if [[ "$EVENT" == "pull_request" ]]; then
            # The checkout merges the PR into its base: that base, not the one recorded when the PR
            # opened, is what it changes, however far the base branch has moved since.
            args=(plan --base "$(git rev-parse HEAD^1)")
            if [[ "$HEAD_REF" == chore/compat-* ]]; then args+=(--routine); fi
          fi
          harnesses="$(python3 -m scripts.harness_compat "${args[@]}")"
          echo "harnesses=$harnesses" >> "$GITHUB_OUTPUT"

  qualify:
    name: Qualify ${{ matrix.harness }}
    needs: [static-checks, plan]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    permissions:
      contents: write
      issues: write
      pull-requests: write
    concurrency:
      group: harness-compat-${{ matrix.harness }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        harness: ${{ fromJSON(needs.plan.outputs.harnesses) }}
    env:
      HARNESS: ${{ matrix.harness }}
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.ref == 'refs/heads/main' && secrets.PR_AUTOMATION_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: sudo apt-get update && sudo apt-get install -y tmux
      - run: uv sync --locked --all-packages --group dev
      - name: Test every newer release and publish each completed outcome
        run: timeout --signal=INT --kill-after=5m 320m .venv/bin/python -m scripts.harness_compat run "$HARNESS"

  verify-gate:
    name: Verify ${{ matrix.harness }} plugin and policy
    needs: [static-checks, plan]
    if: github.event_name == 'pull_request' && needs.plan.outputs.harnesses != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        harness: ${{ fromJSON(needs.plan.outputs.harnesses) }}
    env:
      HARNESS: ${{ matrix.harness }}
      HEAD_REF: ${{ github.head_ref }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: sudo apt-get update && sudo apt-get install -y tmux
      - run: uv sync --locked --all-packages --group dev
      - name: Verify the proposed range without qualifying unrelated newer releases
        run: |
          args=(verify "$HARNESS" --base "$(git rev-parse HEAD^1)")
          if [[ "$HEAD_REF" == chore/compat-* ]]; then args+=(--routine); fi
          timeout --signal=INT --kill-after=5m 320m .venv/bin/python -m scripts.harness_compat "${args[@]}"
