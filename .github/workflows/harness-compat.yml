name: Harness compatibility

on:
  schedule:
    - cron: "43 5 * * *"
  workflow_dispatch:
    inputs:
      harness:
        description: Harness to qualify
        required: true
        default: all
        type: choice
        options: [all, claude, codex, opencode, pi, vibe]
      version:
        description: Exact stable version; empty discovers new releases
        required: false
        type: string
  pull_request:
    paths:
      - ".github/workflows/harness-compat.yml"
      - "scripts/harness_compat/**"
      - "tests/compat/**"
      - "theater/harness/builtin/plugins/**/compat*.py"
      - "theater/harness/builtin/plugins/**/runtime_plan.py"
      - "theater/harness/builtin/plugins/**/runtime_probe.py"
      - "theater/harness/builtin/plugins/**/server_plan.py"
      - "theater/harness/builtin/plugins/**/version.py"
      - "theater/harness/builtin/plugins/**/unified_store_types.py"

permissions:
  contents: read

concurrency:
  # Qualification runs share one queue (they write the rolling branches); PR checks do not.
  group: ${{ github.event_name == 'pull_request' && format('harness-compat-pr-{0}', github.ref) || 'harness-compat' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  cheap-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
      - run: uv sync --locked --all-packages --group dev
      - run: uv run ruff check scripts/harness_compat
      - run: uv run ruff format --check scripts/harness_compat
      - run: uv run mypy
      - run: uv run pytest tests/compat --ignore=tests/compat/test_codex_collector.py -q
      - run: uv run python -m scripts.harness_compat check

  qualify:
    if: github.event_name != 'pull_request'
    needs: cheap-checks
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      issues: write
    strategy:
      fail-fast: false
      matrix:
        harness: [claude, codex, opencode, pi, vibe]
    env:
      HARNESS: ${{ matrix.harness }}
      REQUESTED_HARNESS: ${{ inputs.harness || 'all' }}
      REQUESTED_VERSION: ${{ inputs.version || '' }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Select harness
        id: select
        run: |
          if [[ "$REQUESTED_HARNESS" == "all" || "$REQUESTED_HARNESS" == "$HARNESS" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: steps.select.outputs.run == 'true'
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Restore qualification evidence
        if: steps.select.outputs.run == 'true'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/harness-compat-cache
          key: compat-evidence-${{ matrix.harness }}-${{ github.run_id }}
          restore-keys: compat-evidence-${{ matrix.harness }}-
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        if: steps.select.outputs.run == 'true'
        with:
          enable-cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.select.outputs.run == 'true'
        with:
          node-version: "22"
      - name: Install tmux
        if: steps.select.outputs.run == 'true'
        run: sudo apt-get update && sudo apt-get install -y tmux
      - name: Sync project
        if: steps.select.outputs.run == 'true'
        run: uv sync --locked --all-packages --group dev
      - name: Qualify and prepare publication
        id: compat
        if: steps.select.outputs.run == 'true'
        continue-on-error: true
        env:
          THEATER_COMPAT_DIAGNOSTICS: ${{ runner.temp }}/compat-diagnostics
          HARNESS_COMPAT_CACHE: ${{ runner.temp }}/harness-compat-cache
        run: |
          mkdir -p "$HARNESS_COMPAT_CACHE"
          args=(run --harness "$HARNESS" --publish --run-url "$RUN_URL" \
            --summary-json "$RUNNER_TEMP/compat-summary.json")
          if [[ -n "$REQUESTED_VERSION" ]]; then
            args+=(--version "$REQUESTED_VERSION")
          fi
          uv run python -m scripts.harness_compat "${args[@]}"
      - name: Save qualification evidence
        if: always() && steps.select.outputs.run == 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/harness-compat-cache
          key: compat-evidence-${{ matrix.harness }}-${{ github.run_id }}
      - uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        id: pr
        if: >-
          steps.select.outputs.run == 'true' &&
          steps.compat.outputs.pr_needed == 'true'
        continue-on-error: true
        with:
          token: ${{ secrets.PR_AUTOMATION_TOKEN }}
          base: main
          branch: chore/compat-${{ matrix.harness }}
          commit-message: "chore(compat): advance ${{ matrix.harness }} version gate"
          title: ${{ steps.compat.outputs.pr_title }}
          body: ${{ steps.compat.outputs.pr_body }}
          delete-branch: true
      - name: Upsert failure issue
        if: >-
          steps.select.outputs.run == 'true' &&
          steps.compat.outputs.issue_action == 'upsert'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_BODY: ${{ steps.compat.outputs.issue_body }}
          ISSUE_LABELS: ${{ steps.compat.outputs.issue_labels }}
          ISSUE_TITLE: ${{ steps.compat.outputs.issue_title }}
        run: |
          set -euo pipefail
          gh label create "compat:$HARNESS" --color 5319e7 --force
          gh label create tooling --color d93f0b --force
          gh label create admitted-regression --color b60205 --force
          number="$(gh issue list --state open --limit 100 --json number,title |
            jq -r --arg title "$ISSUE_TITLE" 'map(select(.title == $title))[0].number // empty')"
          if [[ -n "$number" ]]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/$number" -f body="$ISSUE_BODY" --silent
          else
            number="$(gh api -X POST "repos/$GITHUB_REPOSITORY/issues" \
              -f title="$ISSUE_TITLE" -f body="$ISSUE_BODY" --jq '.number')"
          fi
          # Assign labels explicitly so permission failures surface.
          IFS=',' read -ra labels <<< "$ISSUE_LABELS"
          for stale in tooling admitted-regression; do
            if [[ ! ",$ISSUE_LABELS," == *",$stale,"* ]]; then
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/issues/$number/labels/$stale" --silent 2>/dev/null || true
            fi
          done
          add=()
          for label in "${labels[@]}"; do add+=(-f "labels[]=$label"); done
          gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$number/labels" "${add[@]}" --silent
      - name: Close recovered issue
        if: >-
          steps.select.outputs.run == 'true' &&
          steps.compat.outputs.issue_action == 'close'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_TITLE: ${{ steps.compat.outputs.issue_title }}
        run: |
          set -euo pipefail
          number="$(gh issue list --state open --limit 100 --json number,title |
            jq -r --arg title "$ISSUE_TITLE" 'map(select(.title == $title))[0].number // empty')"
          if [[ -n "$number" ]]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/$number" \
              -f state=closed -f state_reason=completed --silent
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$number/comments" \
              -f body="The latest conclusive qualification is green." --silent
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && steps.select.outputs.run == 'true'
        with:
          name: compat-diagnostics-${{ matrix.harness }}
          path: ${{ runner.temp }}/compat-diagnostics
          if-no-files-found: ignore
          retention-days: 7
      - name: Preserve qualification result
        if: >-
          steps.select.outputs.run == 'true' &&
          (steps.compat.outcome == 'failure' || steps.pr.outcome == 'failure')
        run: exit 1
