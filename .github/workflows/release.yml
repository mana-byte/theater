name: release-artifacts

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (must match pyproject.toml and uv.lock)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Source-ref guard
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$GITHUB_REF_NAME" != "main" ]; then
              echo "::error::Manual release must run from main (got $GITHUB_REF_NAME)"
              exit 1
            fi
          else
            if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
              echo "::error::Tag commit $GITHUB_SHA is not contained in origin/main"
              exit 1
            fi
          fi

      - name: Determine version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          if ! printf '%s' "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(rc[0-9]+)?$'; then
            echo "::error::Version '$VERSION' must be N.N.N or N.N.NrcN"
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Verify both project and lock versions
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python - "$VERSION" <<'PY'
          from __future__ import annotations

          import sys
          import tomllib
          from pathlib import Path

          expected = sys.argv[1]
          root = tomllib.loads(Path("pyproject.toml").read_text())
          regie = tomllib.loads(Path("packages/regie/pyproject.toml").read_text())
          lock = tomllib.loads(Path("uv.lock").read_text())
          versions = {item["name"]: item["version"] for item in lock["package"]}
          actual = {
              "theater pyproject": root["project"]["version"],
              "regie pyproject": regie["project"]["version"],
              "theater lock": versions["theater"],
              "regie lock": versions["regie"],
          }
          mismatch = {name: value for name, value in actual.items() if value != expected}
          if mismatch:
              raise SystemExit(f"version {expected!r} does not match {mismatch!r}")
          PY

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          enable-cache: false

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Sync locked dev dependencies
        run: uv sync --locked --group dev

      - name: Build both wheels and sdists
        run: uv build --all-packages --out-dir dist

      - name: Verify distributions with twine check
        run: uvx twine check dist/*

      - name: Smoke independent artifact candidates
        run: uv run pytest tests/packaging/test_artifacts.py -q

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7
