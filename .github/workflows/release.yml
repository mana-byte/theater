name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (must match pyproject.toml and uv.lock)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Source-ref guard
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$GITHUB_REF_NAME" != "main" ]; then
              echo "::error::Manual release must run from main (got $GITHUB_REF_NAME)"
              exit 1
            fi
          else
            if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
              echo "::error::Tag commit $GITHUB_SHA is not contained in origin/main"
              exit 1
            fi
          fi

      - name: Determine version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          if ! printf '%s' "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(rc[0-9]+)?$'; then
            echo "::error::Version '$VERSION' must be N.N.N or N.N.NrcN"
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          if printf '%s' "$VERSION" | grep -qE 'rc[0-9]+$'; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify version matches pyproject.toml and uv.lock
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          PYPROJECT_VERSION=$(grep -m1 '^version = ' pyproject.toml | sed 's/version = "\(.*\)"/\1/')
          LOCK_VERSION=$(awk '/^name = "theater"$/{found=1} found && /^version = /{print; exit}' uv.lock | sed 's/version = "\(.*\)"/\1/')
          if [ "$VERSION" != "$PYPROJECT_VERSION" ]; then
            echo "::error::Version $VERSION does not match pyproject.toml ($PYPROJECT_VERSION)"
            exit 1
          fi
          if [ "$VERSION" != "$LOCK_VERSION" ]; then
            echo "::error::Version $VERSION does not match uv.lock theater entry ($LOCK_VERSION)"
            exit 1
          fi

      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6
        with:
          enable-cache: false

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Sync locked dev dependencies
        run: uv sync --locked --group dev

      - name: Ruff check
        run: uv run ruff check

      - name: Ruff format check
        run: uv run ruff format --check

      - name: Mypy
        run: uv run mypy

      - name: Pytest with coverage
        run: uv run pytest --cov

      - name: Alembic check with fresh THEATER_HOME
        run: |
          export THEATER_HOME="$(mktemp -d)"
          uv run alembic upgrade head
          uv run alembic check

      - name: Build wheel and sdist
        run: uv build

      - name: Verify distributions with twine check
        run: uvx twine check dist/*

      - name: Smoke-install built wheel
        run: |
          uv venv /tmp/smoke-venv
          uv pip install --python /tmp/smoke-venv/bin/python dist/*.whl
          /tmp/smoke-venv/bin/theater --help

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  release:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: dist
          path: dist/

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.whl dist/*.tar.gz --clobber
          else
            RELEASE_FLAGS=()
            if [ "$PRERELEASE" = "true" ]; then
              RELEASE_FLAGS+=(--prerelease)
            fi
            gh release create "$TAG" \
              dist/*.whl dist/*.tar.gz \
              --title "$TAG" \
              --generate-notes \
              "${RELEASE_FLAGS[@]}"
          fi
