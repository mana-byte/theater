name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux
      - name: Set up Python 3.12
        run: uv python install 3.12
      - name: Sync dependencies
        run: uv sync --locked --all-packages --group dev
      - name: Ruff check
        run: uv run ruff check
      - name: Ruff format check
        run: uv run ruff format --check
      - name: Mypy
        run: uv run mypy
      - name: Pytest with coverage
        run: uv run pytest --cov -o faulthandler_timeout=120
      - name: Migrate fresh database to Alembic head
        env:
          THEATER_HOME: ${{ runner.temp }}/theater-home
        run: |
          mkdir -p "$THEATER_HOME"
          uv run alembic upgrade head
      - name: Alembic schema check
        env:
          THEATER_HOME: ${{ runner.temp }}/theater-home
        run: uv run alembic check

  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux
      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install "${{ matrix.python-version }}"
      - name: Sync dependencies
        run: uv sync --locked --all-packages --group dev
      - name: Pytest
        run: uv run pytest -o faulthandler_timeout=120

  macos-sensitive:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
      - name: Install tmux
        run: brew install tmux
      - name: Set up Python 3.12
        run: uv python install 3.12
      - name: Sync dependencies
        run: uv sync --locked --all-packages --group dev
      - name: Peer identity, provider fencing, and live recovery
        run: >-
          uv run pytest -q -o faulthandler_timeout=120
          tests/test_rc10_handshake.py
          tests/test_rc10_process_boundary.py
          tests/test_rc10_provider_fencing.py
          tests/test_runtime_live_recovery.py

  artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
      - name: Set up Python 3.12
        run: uv python install 3.12
      - name: Sync dependencies
        run: uv sync --locked --all-packages --group dev
      - name: Build and smoke independent distributions
        run: uv run pytest tests/test_rc10_artifacts.py -q
