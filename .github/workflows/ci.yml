name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Push runs group by sha so each main push keeps its own run; PR/dispatch group by ref.
  group: ci-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install actionlint 1.7.12
        run: |
          set -euo pipefail
          curl --retry 3 -fsSLo /tmp/actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  /tmp/actionlint.tar.gz" | sha256sum -c
          tar -xzf /tmp/actionlint.tar.gz -C /tmp
          sudo install /tmp/actionlint /usr/local/bin/actionlint
      - name: Actionlint
        run: actionlint
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
      - name: Set up Python 3.12
        run: uv python install 3.12
      - name: Sync dependencies
        run: uv sync --locked --all-packages --group dev
      - name: Ruff check
        run: uv run ruff check
      - name: Ruff format check
        run: uv run ruff format --check
      - name: Mypy
        run: uv run mypy
      - name: Migrate fresh database to Alembic head
        env:
          THEATER_HOME: ${{ runner.temp }}/theater-home
        run: |
          mkdir -p "$THEATER_HOME"
          uv run alembic upgrade head
      - name: Alembic schema check
        env:
          THEATER_HOME: ${{ runner.temp }}/theater-home
        run: uv run alembic check

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux
      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install "${{ matrix.python-version }}"
      - name: Sync dependencies
        run: uv sync --locked --all-packages --group dev
      - name: Pytest with coverage
        if: matrix.python-version == '3.12'
        run: uv run pytest -n auto --cov --cov-fail-under=80 -o faulthandler_timeout=120
      - name: Pytest
        if: matrix.python-version != '3.12'
        run: uv run pytest -n auto -o faulthandler_timeout=120

  macos-sensitive:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
      - name: Install tmux
        run: brew install tmux
      - name: Set up Python 3.12
        run: uv python install 3.12
      - name: Sync dependencies
        run: uv sync --locked --all-packages --group dev
      - name: Peer identity, provider fencing, and live recovery
        run: >-
          uv run pytest -q -o faulthandler_timeout=120
          tests/frontend/test_public_socket.py
          tests/boundaries/test_process_boundary.py
          tests/provider/test_callback_client.py
          tests/daemon/harness_runtime/test_live_recovery.py

  artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
      - name: Set up Python 3.12
        run: uv python install 3.12
      - name: Sync dependencies
        run: uv sync --locked --all-packages --group dev
      - name: Build and smoke independent distributions
        run: uv run pytest tests/packaging/test_artifacts.py -q
