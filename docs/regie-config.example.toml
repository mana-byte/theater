# Régie configuration — every standalone [regie] setting and its default.
#
#   mkdir -p "$THEATER_HOME/regie"
#   cp docs/regie-config.example.toml "$THEATER_HOME/regie/config.toml"
#
# Theater never reads or rewrites this file. It belongs to the independently
# installed `regie` command, which reads only the [regie] table below.

[regie]

# Defaults to "ansi-dark", which follows your terminal's own colours.
# theme = "catppuccin-mocha"

# State-follow and diagnostic-bus refresh intervals, in seconds.
tree_interval = 1.0
bus_interval = 0.4
bus_batch = 50

# Tree and layout presentation.
cwd_segments = 2
participant_detail = "cwd"
sidebar_width = 52
bus_visible = false
# The usage footer starts hidden; `$` or the palette toggles it for the session.
usage_visible = false
startup_reveal = true

# What plays in the empty space under the agent tree: "footer" (a quiet line),
# "leaves", "fire", "aquarium", "stars", the name of a plugin in regie/plugins/, or
# "none". It plays "away" (while you work in a staged terminal or trajectory) by default,
# or "tree" (while the tree has focus).
tree_ambience = "footer"
tree_ambience_when = "away"
cost_window = "day"

# Leave dashboard_sentences absent to use the built-in rotating content.
# dashboard_sentences = ["One focused sentence.", "Another focused sentence."]
dashboard_sentence_hold_seconds = 10.0
dashboard_sentence_char_interval = 0.1
dashboard_tip_hold_seconds = 6.0
dashboard_tip_char_interval = 0.04

# Maximum records shown by the local trajectory presentation page.
trajectory_page_size = 30
